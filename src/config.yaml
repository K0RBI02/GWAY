name: "GWAY"
version: "0.5.5"
slug: gway
description: "GWAY: custom web interface for the TP-Link Archer NX500"
url: "https://github.com/K0RBI02/GWAY"
arch:
  - aarch64
  - amd64
init: false
ports:
  8480/tcp: 8480
ports_description:
  8480/tcp: "Web interface"
options:
  router_host: "https://192.168.0.1"
  router_password: ""
  poll_seconds: 8
schema:
  router_host: str
  router_password: password
  poll_seconds: int(4,60)
