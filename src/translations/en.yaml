configuration:
  router_host:
    name: Router address
    description: Address of the router web interface including https://, e.g. https://192.168.0.1
  router_password:
    name: Router password
    description: Admin password of the router web interface
  poll_seconds:
    name: Poll interval (seconds)
    description: How often the router is queried (4 to 60)
network:
  8480/tcp: Web interface
