configuration:
  router_host:
    name: Router-Adresse
    description: Adresse der Router-Weboberfläche mit https://, z. B. https://192.168.0.1
  router_password:
    name: Router-Passwort
    description: Admin-Passwort der Router-Weboberfläche
  poll_seconds:
    name: Abfrage-Intervall (Sekunden)
    description: Wie oft der Router abgefragt wird (4 bis 60)
network:
  8480/tcp: Web-Oberfläche
